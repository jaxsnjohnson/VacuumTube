name: Timestamp playback regression
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  playback:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            build: 38690743365
          - os: macos-latest
            arch: arm64
            build: 38690745772
          - os: macos-26-intel
            arch: x64
            build: 38690745772
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/vt-test" playwright@1.62.1
      - name: Reproduce the missing timestamp in the previous downloaded build
        if: matrix.arch == 'arm64' && matrix.build == 38690745772
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/vt-test/node_modules/playwright
          EXPECT_TIMESTAMP: 'false'
        run: |
          gh run download 38654696431 --repo jaxsnjohnson/VacuumTube --name VacuumTube-test-macOS --dir previous
          ditto -x -k previous/VacuumTube-arm64.zip previous/extracted
          export REVIEW_EXECUTABLE="$GITHUB_WORKSPACE/previous/extracted/VacuumTube.app/Contents/MacOS/VacuumTube"
          node review/timestamp-playback.cjs
      - name: Download the replacement package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ matrix.build }}
        run: |
          gh run watch "$BUILD_RUN" --repo jaxsnjohnson/VacuumTube --exit-status --interval 15
          gh run download "$BUILD_RUN" --repo jaxsnjohnson/VacuumTube --name VacuumTube-test-macOS --dir fixed
          cd fixed
          shasum -a 256 -c SHA256SUMS
      - name: Verify real playback timestamps through production native shortcuts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/vt-test/node_modules/playwright
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          ditto -x -k "fixed/VacuumTube-$PACKAGE_ARCH.zip" fixed/extracted
          codesign --verify --deep --strict fixed/extracted/VacuumTube.app
          export REVIEW_EXECUTABLE="$GITHUB_WORKSPACE/fixed/extracted/VacuumTube.app/Contents/MacOS/VacuumTube"
          node review/timestamp-playback.cjs
