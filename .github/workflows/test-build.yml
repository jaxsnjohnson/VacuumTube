name: Unmodified baseline fullscreen diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4544c76c3c0816178b66bbe6cadd36aeee34af4c
          path: subject
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: subject
      - run: npm install --prefix "$RUNNER_TEMP/vt-test" playwright@1.62.1
      - run: node ../review/baseline-fullscreen.cjs
        working-directory: subject
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/vt-test/node_modules/playwright
