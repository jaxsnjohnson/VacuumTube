name: Native shortcut review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install --prefix "$RUNNER_TEMP/vt-test" playwright@1.62.1
      - name: Native keyboard and clipboard integration
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/vt-test/node_modules/playwright
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node review/native-shortcuts.cjs
          else
            node review/native-shortcuts.cjs
          fi
